name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www && cp index.html www/index.html
      - run: npx cap add android
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: App icon and dark launch screen
        run: |
          RES=android/app/src/main/res
          find $RES \( -name 'ic_launcher.*' -o -name 'ic_launcher_round.*' \) -delete
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            mkdir -p $RES/mipmap-$n
            convert icon.jpg -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert icon.jpg -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            convert icon.jpg -resize ${f}x${f} $RES/mipmap-$n/ic_fg.png
          done
          mkdir -p $RES/mipmap-anydpi-v26
          for x in ic_launcher ic_launcher_round; do
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '  <background android:drawable="@color/app_icon_bg"/>' '  <foreground android:drawable="@mipmap/ic_fg"/>' '</adaptive-icon>' > $RES/mipmap-anydpi-v26/$x.xml
          done
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '  <color name="app_icon_bg">#F6F7F9</color>' '  <color name="app_bg">#050507</color>' '</resources>' > $RES/values/app_colors.xml
          cat > $RES/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar"/>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">@color/app_bg</item>
                  <item name="android:navigationBarColor">@color/app_bg</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowSplashScreenBackground">@color/app_bg</item>
              </style>
          </resources>
          XML
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
